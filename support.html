  const b64 = (s) => Uint8Array.from(atob(s), (ch) => ch.charCodeAt(0));

  const decrypt = async (key) => new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(c.iv) }, key, b64(c.data)));

    document.open();
    document.write(html);
    document.close();
  }
  try {
    const saved = sessionStorage.getItem(store);
    if (saved) return show(await decrypt(await crypto.subtle.importKey('raw', b64(saved), 'AES-GCM', false, ['decrypt'])));

  const error = form.querySelector('.error');
  const button = form.querySelector('button');
  form.hidden = false;
  input.focus();
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    button.disabled = true;
    error.hidden = true;
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(input.value), 'PBKDF2', false, ['deriveKey']);

        { name: 'AES-GCM', length: 256 },
        true,
        ['decrypt'],

      button.disabled = false;
      input.select();
