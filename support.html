    document.write(html);
    document.close();

  input.focus();
  form.addEventListener('submit', async (event) => {

    button.disabled = true;
    error.hidden = true;

        { name: 'AES-GCM', length: 256 },
        true,
        ['decrypt'],

      button.disabled = false;
