    document.write(html);
    document.close();
  }

  input.focus();
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    button.disabled = true;
    error.hidden = true;
    try {

        true,
        ['decrypt'],

      button.disabled = false;
